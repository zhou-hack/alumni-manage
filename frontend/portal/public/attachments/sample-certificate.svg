<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 底：暖白纸 -->
  <rect width="800" height="600" fill="#FBF6EC"/>
  <!-- 外框：双线金 -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#C19A3F" stroke-width="3"/>
  <rect x="44" y="44" width="712" height="512" fill="none" stroke="#C19A3F" stroke-width="1"/>

  <!-- 顶部城堡垛口装饰 -->
  <g fill="#C19A3F">
    <rect x="60" y="60" width="18" height="14"/>
    <rect x="86" y="60" width="18" height="14"/>
    <rect x="112" y="60" width="18" height="14"/>
    <rect x="138" y="60" width="18" height="14"/>
    <rect x="60" y="60" width="96" height="6"/>
    <rect x="644" y="60" width="18" height="14"/>
    <rect x="670" y="60" width="18" height="14"/>
    <rect x="696" y="60" width="18" height="14"/>
    <rect x="722" y="60" width="18" height="14"/>
    <rect x="644" y="60" width="96" height="6"/>
  </g>

  <!-- 眉标 -->
  <text x="400" y="120" font-family="Consolas, monospace" font-size="14" letter-spacing="6" fill="#8A6B1F" text-anchor="middle">FURUAN CASTLE ALUMNI</text>

  <!-- 主标题 -->
  <text x="400" y="180" font-family="STZhongsong, SimSun, serif" font-size="46" font-weight="900" fill="#1F2937" text-anchor="middle">荣誉证书</text>
  <text x="400" y="210" font-family="Consolas, monospace" font-size="12" letter-spacing="4" fill="#8A6B1F" text-anchor="middle">CERTIFICATE OF HONOR</text>

  <!-- 分隔线 -->
  <line x1="240" y1="240" x2="560" y2="240" stroke="#C19A3F" stroke-width="1"/>

  <!-- 正文 -->
  <text x="400" y="290" font-family="STZhongsong, SimSun, serif" font-size="18" fill="#1F2937" text-anchor="middle">林子轩 同学</text>
  <text x="400" y="326" font-family="STZhongsong, SimSun, serif" font-size="15" fill="#4B5563" text-anchor="middle">在 2022 年度福建省 VR 应用开发大赛中</text>
  <text x="400" y="354" font-family="STZhongsong, SimSun, serif" font-size="15" fill="#4B5563" text-anchor="middle">表现优异，荣获 一等奖</text>

  <!-- 印章（右下） -->
  <g transform="translate(620,460)">
    <circle r="42" fill="none" stroke="#A63D2F" stroke-width="2" opacity="0.85"/>
    <circle r="34" fill="none" stroke="#A63D2F" stroke-width="0.8" opacity="0.7"/>
    <text y="-4" font-family="STZhongsong, SimSun, serif" font-size="11" fill="#A63D2F" text-anchor="middle" opacity="0.9">福州软件职业技术学院</text>
    <text y="14" font-family="STZhongsong, SimSun, serif" font-size="11" fill="#A63D2F" text-anchor="middle" opacity="0.9">荣誉证书专用章</text>
  </g>

  <!-- 颁发日期（左下） -->
  <text x="120" y="500" font-family="STZhongsong, SimSun, serif" font-size="13" fill="#4B5563">颁发日期：2022 年 12 月</text>

  <!-- 底部装饰 -->
  <g fill="#C19A3F">
    <rect x="60" y="540" width="18" height="14"/>
    <rect x="86" y="540" width="18" height="14"/>
    <rect x="112" y="540" width="18" height="14"/>
    <rect x="138" y="540" width="18" height="14"/>
    <rect x="60" y="540" width="96" height="6"/>
    <rect x="644" y="540" width="18" height="14"/>
    <rect x="670" y="540" width="18" height="14"/>
    <rect x="696" y="540" width="18" height="14"/>
    <rect x="722" y="540" width="18" height="14"/>
    <rect x="644" y="540" width="96" height="6"/>
  </g>
</svg>
