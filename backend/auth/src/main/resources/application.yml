server:
  port: 8080

spring:
  application:
    name: alumni-auth
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/alumni_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:almuni}
    password: ${DB_PASSWORD:almuni_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 单库 alumni_platform 已由 schema.sql 建好结构（等同 V1+V2），非空库启动时以 V2 为基线跳过历史迁移；
    # 全新空库不受影响（Flyway 仅在库非空时才 baseline）
    baseline-on-migrate: true
    baseline-version: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  jackson:
    # 全模块字段统一 snake_case 出/入参
    property-naming-strategy: SNAKE_CASE
    serialization:
      # Instant 等业务时间字段按 ISO 8601 UTC 输出
      write-dates-as-timestamps: false

app:
  jwt:
    # 开发默认密钥（HS256, base64 32 字节），生产环境必须用 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:rN7vY2kQ9wE3tU8iO1pA5sD6fG0hJ4lKzXcVbNmQwE=}
    access-expire-seconds: 7200      # access_token 2 小时
  refresh-expire-seconds: 604800     # refresh_token 7 天
  sms:
    # mock 模式：验证码打印到日志，并在响应 dev_code 字段回显（仅供开发联调）
    mock: true

logging:
  level:
    com.alumni.auth: info
