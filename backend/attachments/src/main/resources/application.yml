server:
  port: 8082

spring:
  application:
    name: alumni-attachments
  servlet:
    multipart:
      # 单文件 ≤10MB；单请求 ≤55MB（批量 5 个 × 10MB + 表单开销）
      max-file-size: 10MB
      max-request-size: 55MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/alumni_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:almuni}
    password: ${DB_PASSWORD:almuni_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_attachments
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # 与 auth 模块同一密钥（auth 签发、各模块本地验签）；生产用 JWT_SECRET 环境变量统一覆盖
    secret: ${JWT_SECRET:rN7vY2kQ9wE3tU8iO1pA5sD6fG0hJ4lKzXcVbNmQwE=}
  storage:
    # 附件存储根目录（文件只经 preview 接口鉴权后流出，不直接暴露静态映射）
    root: ${STORAGE_ROOT:./storage}
    # 批量上传上限（超出 400 BATCH_LIMIT_EXCEEDED）
    batch-limit: 5
    # 孤儿附件（unreferenced）保留时长（小时），定时任务每小时清理一次
    orphan-retention-hours: 24

logging:
  level:
    com.alumni.attachments: info
